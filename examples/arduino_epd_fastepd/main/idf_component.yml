dependencies:
  idf: ">=5.5"

  espressif/arduino-esp32:
    version: "^3.3.11"
    rules:
      - if: "target in [esp32p4]"

  # FastEPD drives the parallel EPD bus and the TPS65185 PMIC itself, so the
  # sketch only has to hand it an I2C bus and a pin map.
  #
  # Still in test, so it lives on the staging registry rather than the main one.
  ddb0515/fastepd:
    version: "2.2.5"
    registry_url: https://components-staging.espressif.com
