version: "0.1.0"
description: Board Support Package (BSP) for the epdInky ESP32-P4/C6 rev.2 board
url: https://github.com/ddB0515/esp-bsp/tree/master/bsp/epdinky_p4_board

targets:
  - esp32p4

tags:
  - bsp
  - epaper

dependencies:
  idf: ">=5.5"

  # Wi-Fi/BT are provided by the on-board ESP32-C6 over SDIO via esp-hosted.
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
